<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paddock Racing Manager</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout: management screens with a fixed bottom nav; race = full-bleed follow camera with overlaid standings, track map, driver panels and transport controls. Deliberately dark single theme. */
:root{
  color-scheme:dark;
  --bg:#0b151c; --panel:#11202a; --panel2:#172a35; --glass:rgba(10,20,27,.88); --line:#22404f; --fg:#e3ecf0; --muted:#86a0ae;
  --accent:#56cfe1; --go:#f0a330; --purple:#b77cff; --good:#3ddc84; --warn:#ffb547; --bad:#ff5d5d;
  --f-display:'Barlow Condensed','Arial Narrow',sans-serif;
  --f-body:'Inter',system-ui,-apple-system,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
[hidden]{display:none!important}
#app{max-width:1360px;margin:0 auto;padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body.hasnav #app{padding-bottom:110px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
h1{font-size:clamp(44px,8vw,88px);line-height:.9;text-transform:uppercase}
h2{font-size:28px;text-transform:uppercase}
h3{font-size:20px;text-transform:uppercase}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}.purple{color:var(--purple)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{background:var(--go);color:#1d1100;border:0;border-radius:3px;padding:10px 20px;font-family:var(--f-display);font-weight:700;font-size:18px;text-transform:uppercase;letter-spacing:.04em}
.btn:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.ghost{background:transparent;border:1px solid var(--line);border-radius:3px;padding:7px 12px;color:var(--fg)}
.ghost:hover{border-color:var(--accent)}
.ghost[disabled]{opacity:.4;cursor:not-allowed}
.seg{background:var(--panel2);border:1px solid var(--line);padding:6px 10px;font-size:12px;border-radius:2px;color:var(--muted)}
.seg.on{background:var(--accent);color:#04161c;border-color:var(--accent);font-weight:600}
.segs{display:flex;flex-wrap:wrap;gap:3px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:16px;min-width:0}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.stack{display:flex;flex-direction:column;gap:16px}
.bar{height:6px;background:var(--panel2);border-radius:2px;overflow:hidden;position:relative}
.bar>i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:2px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:400;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:6px 8px;border-bottom:1px solid color-mix(in srgb,var(--line) 50%,transparent)}
tr.me td{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.scroll{overflow-x:auto}
.chip{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:6px}
.stars{color:var(--go);letter-spacing:2px;font-size:13px}.stars s{color:#3a5260;text-decoration:none}
/* top bar */
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:16px}
.tb-l{display:flex;gap:16px;align-items:center}
.tb-team{font-family:var(--f-display);font-weight:700;font-size:24px;text-transform:uppercase;line-height:.95;color:var(--team);padding-right:16px;border-right:1px solid var(--line)}
.tb-team small{display:block;font-size:13px;letter-spacing:.2em;color:var(--fg);opacity:.7}
.tb-page b{font-family:var(--f-display);font-size:20px;text-transform:uppercase;display:block;line-height:1}
.tb-page span{font-size:12px;color:var(--muted)}
.kpis{display:flex;gap:8px;flex-wrap:wrap}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:6px 12px}
.pill .v{font-family:var(--f-mono);font-size:15px;font-weight:600}
.pill.money{border-color:color-mix(in srgb,var(--good) 55%,transparent)}
/* bottom nav */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:15;background:#d9e1e5;color:#20343f;padding-bottom:env(safe-area-inset-bottom,0px)}
.bnav-in{max-width:1360px;margin:0 auto;display:flex;align-items:stretch;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.bnav .nt{background:none;border:0;border-right:1px solid #bfcad0;padding:10px 14px;font-size:12px;font-weight:600;color:#3d5664;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:72px}
.bnav .nt svg{width:18px;height:18px}
.bnav .nt.on{background:#3d8ea3;color:#fff}
.bnav .sp{flex:1}
.bnav .date{background:#3d8ea3;color:#fff;padding:6px 14px;font-size:12px;text-align:center;display:flex;flex-direction:column;justify-content:center;font-weight:600}
.bnav .cont{background:var(--go);color:#1d1100;border:0;font-family:var(--f-display);font-weight:700;font-size:20px;text-transform:uppercase;padding:0 28px;min-width:180px}
@media (max-width:720px){.bnav .nt{min-width:0;padding:8px 8px;font-size:10px}.bnav .date{display:none}.bnav .cont{min-width:0;padding:0 10px;font-size:15px;white-space:nowrap}}
/* title + team select */
.title{min-height:80vh;display:grid;align-content:center;gap:24px;max-width:760px}
.title p{max-width:60ch;color:var(--muted);font-size:16px}
.tsel{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px}
@media (max-width:900px){.tsel{grid-template-columns:1fr}}
.tcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;align-content:start}
.tcard{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:14px 12px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:92px}
.tcard b{font-family:var(--f-display);font-size:20px;line-height:1;text-transform:uppercase;font-style:italic;color:var(--tc)}
.tcard.on{border-color:var(--fg);background:var(--panel2)}
.tdet{display:flex;flex-direction:column;gap:14px}
.tdet h2{color:var(--tc);font-style:italic}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv div{background:var(--panel2);padding:8px 10px;border-radius:3px}
.kv b{font-family:var(--f-mono);display:block;font-size:16px}
.cbars{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end;height:120px;border-bottom:1px solid var(--line)}
.cbars i{display:block;background:var(--good);border-radius:2px 2px 0 0}
.cbl{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;font-size:10px;color:var(--muted);text-align:center;font-family:var(--f-mono)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid transparent}
.sw.on{border-color:var(--fg)}
input[type=text]{background:var(--panel2);border:1px solid var(--line);color:var(--fg);padding:9px 12px;border-radius:3px;font:inherit;font-size:16px;width:100%}
input[type=range]{width:100%;accent-color:var(--accent)}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px}
.cal div{border:1px solid var(--line);border-radius:3px;padding:8px;font-size:12px;min-width:0}
.cal div.now{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
.cal div.done{opacity:.55}
.cal b{display:block;font-family:var(--f-display);font-size:15px;text-transform:uppercase;line-height:1.1}
/* part fitting */
.fit{display:grid;grid-template-columns:1fr 150px 1fr;gap:10px;align-items:center}
.fit .carsvg{grid-column:2;grid-row:1/span 3;width:100%;height:auto;opacity:.75}
.pcard2{background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:8px 10px;display:flex;flex-direction:column;gap:5px;min-width:0}
.pcard2 .ph{display:flex;justify-content:space-between;font-size:10px;font-family:var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pcard2 .ph.risky{color:var(--warn)}
.pcard2 b{font-size:14px}
.pcard2 .bar{height:5px}
@media (max-width:560px){.fit{grid-template-columns:1fr 1fr}.fit .carsvg{display:none}}
.imp{letter-spacing:1px;color:var(--warn);font-size:10px}
.design{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:10px}
.dopt{text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:12px;display:flex;flex-direction:column;gap:4px}
.dopt:hover{border-color:var(--accent)}
.dopt b{font-family:var(--f-display);font-size:18px;text-transform:uppercase}
.dopt[disabled]{opacity:.4;cursor:not-allowed}
select{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:3px;padding:8px;font:inherit}
/* drivers */
.dcard{display:flex;flex-direction:column;gap:10px}
.dhead{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.dnum{font-family:var(--f-display);font-size:40px;font-weight:700;line-height:1;color:var(--team,var(--accent))}
.stat{display:grid;grid-template-columns:96px 1fr 30px;gap:8px;align-items:center;font-size:12px}
/* weekend */
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.steps span{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:5px 10px;border:1px solid var(--line);border-radius:3px;color:var(--muted)}
.steps span.on{border-color:var(--accent);color:var(--accent)}
.slider{display:grid;gap:4px}
.slider .ends{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.fb{font-size:12px;padding:6px 8px;border-radius:3px;background:var(--panel2)}
.wxrow{display:flex;gap:3px;flex-wrap:wrap}
.wxrow i{display:block;width:12px;height:20px;border-radius:2px;background:var(--panel2);position:relative;overflow:hidden}
.wxrow i b{position:absolute;left:0;right:0;bottom:0;background:#3d8bff}
.tbtn{width:32px;height:32px;border-radius:50%;background:var(--panel2);border:3px solid var(--c);font-family:var(--f-mono);font-weight:600;font-size:12px;color:var(--fg)}
.tbtn.on{background:var(--c);color:#0b151c}
.tbtn.keep{width:auto;border-radius:16px;padding:0 10px;border-color:var(--line);font-size:11px}
.tbtn.keep.on{background:var(--fg)}
.boxrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
/* tyre ring */
.tring{--w:100;width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;background:conic-gradient(var(--c) calc(var(--w)*1%),#2a3a44 0);flex:none}
.tring b{width:13px;height:13px;border-radius:50%;background:#0d1a22;display:grid;place-items:center;font-family:var(--f-mono);font-size:8px;font-weight:600;color:var(--fg)}
/* race view */
.rv{position:relative}
.stage{position:relative;height:clamp(560px,80vh,820px);border-radius:4px;overflow:hidden;background:#24361f;border:1px solid var(--line);user-select:none;-webkit-user-select:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:pointer}
.rtop{position:absolute;top:0;right:0;display:flex;gap:2px;z-index:3}
.rtop>div{background:var(--glass);padding:6px 14px;min-width:120px}
.rtop .eyebrow{font-size:9px}
.rtop .bar{height:4px;margin-top:4px;width:110px}
.rtop .wxi{font-size:20px;line-height:1;min-width:0}
.mini{position:absolute;right:10px;top:54px;width:210px;height:160px;z-index:3;pointer-events:none}
.stand{position:absolute;left:0;top:0;width:262px;max-height:calc(100% - 158px);overflow:auto;background:var(--glass);z-index:4;font-size:12px}
.stand .sh{display:flex;justify-content:space-between;padding:6px 10px;background:#24414d;font-weight:600;font-size:12px}
.srow{display:grid;grid-template-columns:22px 4px 1fr 12px 22px 26px 46px;gap:6px;align-items:center;padding:3px 10px 3px 6px;cursor:pointer;border:0;background:none;width:100%;text-align:left;font-size:12px}
.srow:nth-child(odd){background:rgba(255,255,255,.025)}
.srow:hover{background:rgba(86,207,225,.12)}
.srow.me{background:rgba(86,207,225,.16)}
.srow.sel{outline:1px solid var(--accent);outline-offset:-1px}
.srow.out{opacity:.45}
.srow .c{height:14px}
.srow .g{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.srow .ar{font-size:9px}
.tag{font-family:var(--f-mono);font-size:9px;padding:1px 4px;border-radius:2px;background:#53636c;color:#fff}
.tag.pit{background:#2b6f80}.tag.out{background:#a33b3b}
.lbl{position:absolute;left:0;top:0;z-index:2;pointer-events:none;display:flex;flex-direction:column;align-items:flex-start;transform:translate(-9999px,0)}
.lbl .box{display:flex;align-items:stretch;background:var(--glass);font-size:15px;white-space:nowrap}
.lbl .pos{background:var(--tc);color:#08131a;font-family:var(--f-display);font-weight:700;font-size:20px;padding:0 10px;display:flex;align-items:center}
.lbl .nm{padding:4px 10px;display:flex;flex-direction:column;justify-content:center}
.lbl .nm b{font-family:var(--f-display);font-size:20px;line-height:1;text-transform:uppercase}
.lbl .nm small{font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.lbl .ty{padding:4px 10px;display:flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11px;color:var(--good)}
.lbl .stem{width:1px;height:46px;background:rgba(255,255,255,.55);margin-left:14px}
.ntag{position:absolute;left:0;top:0;z-index:2;pointer-events:none;background:var(--glass);border-left:3px solid var(--tc);padding:2px 8px;font-family:var(--f-display);font-size:16px;font-weight:600;transform:translate(-9999px,0)}
.comm{position:absolute;left:50%;bottom:118px;transform:translateX(-50%);z-index:3;background:rgba(200,214,220,.18);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);padding:5px 16px;font-size:13px;max-width:46%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:2px}
.ctr{position:absolute;left:50%;bottom:0;transform:translateX(-50%);z-index:4;display:flex;align-items:stretch;background:var(--glass);height:62px}
.ctr .cam{display:flex;gap:2px;padding:8px}
.ctr .cam button{width:46px;background:var(--panel2);border:0;border-radius:2px;color:var(--muted);font-size:10px;font-weight:600}
.ctr .cam button.on{background:#3d8ea3;color:#fff}
.ctr .lap{padding:6px 14px;display:flex;flex-direction:column;justify-content:center;min-width:118px;border-left:1px solid var(--line);border-right:1px solid var(--line)}
.ctr .lap b{font-family:var(--f-display);font-size:28px;line-height:1;font-weight:600}
.ctr .lap .bar{height:3px;margin-top:5px}
.ctr .spd{display:flex}
.ctr .spd button{width:42px;background:none;border:0;border-right:1px solid var(--line);color:var(--muted);font-family:var(--f-display);font-size:18px;font-weight:600}
.ctr .spd button.on{background:#3d8ea3;color:#fff}
.ctr .spd button.end{width:auto;padding:0 12px;font-size:14px}
.scb{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:3;background:var(--warn);color:#1b1200;font-family:var(--f-display);font-weight:700;font-size:20px;text-transform:uppercase;padding:4px 14px;border-radius:2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.6}}
@media (prefers-reduced-motion:reduce){.scb{animation:none}}
.over{position:absolute;inset:0;display:grid;place-items:center;background:rgba(11,21,28,.6);z-index:6}
/* driver panels */
.pan{position:absolute;bottom:0;width:clamp(300px,26%,370px);z-index:5;display:flex;flex-direction:column}
.pan.l{left:0}.pan.r{right:0}
.pan .gaps{display:flex;align-items:center;gap:8px;background:var(--glass);padding:4px 10px;font-family:var(--f-mono);font-size:13px;align-self:stretch}
.pan .gaps .pc{width:20px;text-align:center;border-left:3px solid var(--tc,#888);font-weight:600}
.pan .gaps .ln{flex:1;height:1px;background:var(--line);position:relative}
.pan .tabs3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:3px;background:var(--glass);padding:4px}
.pan .tabs3 button{background:#2b3f4a;border:0;padding:7px;font-size:12px;font-weight:600;color:var(--fg);border-radius:2px}
.pan .tabs3 button.pit{background:#3d8ea3}
.pan .tabs3 button.on{outline:2px solid var(--fg);outline-offset:-2px}
.pan .tabs3 button.boxing{background:var(--warn);color:#1b1200}
.pan .main{display:grid;grid-template-columns:minmax(0,1fr) auto 70px 64px;gap:10px;align-items:center;background:#18303a;padding:8px 10px;border-top:3px solid var(--tc)}
.pan .who b{font-family:var(--f-display);font-size:30px;line-height:.9;display:block}
.pan .who span{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pan .sec{font-family:var(--f-mono);font-size:11px;display:grid;grid-template-columns:auto auto;gap:2px 8px;align-items:center}
.pan .sec label{color:var(--muted);font-size:10px}
.gauge{--w:100;--c:#ffd23f;width:58px;height:58px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--w)*1%),#2a3a44 0);display:grid;place-items:center;position:relative}
.gauge>div{width:42px;height:42px;border-radius:50%;background:#18303a;display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:14px;line-height:1}
.gauge small{position:absolute;bottom:-3px;right:-6px;font-family:var(--f-mono);font-size:10px;background:#18303a;padding:0 2px}
.fuel{display:grid;grid-template-columns:1fr 8px;gap:6px;align-items:end}
.fuel label{font-size:10px;font-family:var(--f-mono);color:var(--muted);display:block}
.fuel b{font-family:var(--f-mono);font-size:12px;display:block}
.fuel small{font-family:var(--f-mono);font-size:10px}
.fuel .fb2{height:46px;background:#2a3a44;position:relative;border-radius:1px}
.fuel .fb2 i{position:absolute;left:0;right:0;bottom:0;background:var(--go)}
.pop{position:absolute;bottom:100%;left:0;right:0;background:var(--glass);border:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:10px;margin-bottom:4px;max-height:380px;overflow:auto}
.pop h4{margin:0;font-family:var(--f-display);font-size:16px;text-transform:uppercase;font-weight:700}
.pop .lab{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.prow{display:grid;grid-template-columns:90px 1fr 38px;gap:8px;align-items:center;font-size:12px}
.eng{font-size:12px;color:var(--muted);border-left:2px solid var(--accent);padding-left:8px}
.chk{display:flex;gap:6px;align-items:center;font-size:12px}
.boxbtn{background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:8px 14px;font-family:var(--f-display);font-weight:700;font-size:17px;text-transform:uppercase}
.boxbtn.on{background:var(--warn);color:#1b1200;border-color:var(--warn)}
.feed{font-family:var(--f-mono);font-size:12px;display:flex;flex-direction:column;gap:3px;max-height:220px;overflow:auto}
.feed div{color:var(--muted)}.feed div.me{color:var(--fg)}.feed div.hot{color:var(--warn)}
.racelog{margin-top:12px}
/* phones and tablets: track, transport controls and BOTH driver panels share one screen; standings follow below */
@media (max-width:1200px){
  .rv{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px}

];
// each track's demand d=[speed,accel,corner] sets how much every part matters there
TRACKS.forEach(t=>{t.cap=Math.ceil(t.laps*.62)+1;t.w={};for(const k of['engine','gearbox','brakes','suspension','frontWing','rearWing'])t.w[k]=STATS.reduce((a,[s],i)=>a+t.d[i]*(MIX[s][k]||0),0)});

 ['V','Vostok Autosport','VOS','#c9d1d9',.52,'Well funded and impatient. Quick in a straight line, fragile everywhere else.'],

 ['Z','Zenith Motorworks','ZEN','#8e44ad',.28,'Struggling to stay in the Meridian Cup.'],

const FIRST=['Teo','Lukas','Aiko','Rafael','Sam','Niko','Ines','Jonah','Clara','Oskar','Priya','Felix','Dmitri','Yusuf','Hugo','Elias','Kai','Leo','Mila','Arjun','Tomas','Zara','Bruno','Freya','Marco','Ren','Noor','Ivo','Lena','Mateus','Saoirse','Viktor','Amara','Jules','Tariq','Esme','Pavel','Hana','Diego','Ola'];

function mkDriver(name,tier){

    for(let k=0;k<2;k++){const d=mkDriver(nm(),clamp(lerp(...S.drv,pv.tier)+R(-.08,.06),0,1));d.teamId=t.id;d.num=num++;t.drivers.push(d.id)}

/* ---------- car model ---------- */
function carScore(t,tr){let s=0;for(const[k]of PARTS)s+=t.parts[k].perf*tr.w[k];return s}
function carAvg(t){let s=0;for(const[k]of PARTS)s+=t.parts[k].perf;return s/PARTS.length}
function carStat(t,s){let v=0;for(const k in MIX[s])v+=t.parts[k].perf*MIX[s][k];return v}
// seconds per lap gained (+) or lost (-) by a race focus at a track; 0 = balanced
function focusGain(f,tr){return f?(tr.d[f-1]-1/3)*3-.15:0}
const bestFocus=tr=>{let b=0,g=0;for(let f=1;f<4;f++){const x=focusGain(f,tr);if(x>g){g=x;b=f}}return b};
const wearFocus=[1,1,1.06,1.12],fuelFocus=[1,1.06,1,1],ovtFocus=[0,.06,.04,0];
function weatherPen(c,w){const cat=TYRES[c].cat;
  if(cat==='dry')return w*9;
  if(cat==='inter')return w<.2?2.4+(.2-w)*5:(w>.75?(w-.75)*8:0);
  return w<.6?2.8+(.6-w)*6:0}
function weatherWear(c,w){const cat=TYRES[c].cat;if(cat==='dry')return w>.3?.7:1;if(cat==='inter')return w<.2?2.5:1;return w<.5?3:1}
function wearPen(x){return Math.pow(x/100,2)*2.4+(x>80?(x-80)*.18:0)}
function wearRate(car,c,w,tr){return TYRES[c].wear*[.7,1,1.35][car.mode]*(1.2-car.d.tyre/100*.4)*tr.abr*weatherWear(c,w)*wearFocus[car.focus||0]}
function bestTyreFor(w){return TK.filter(k=>k!=='soft'&&k!=='medium').reduce((a,b)=>weatherPen(b,w)<weatherPen(a,w)?b:a,'hard')}
const condAvg=c=>{let s=0;for(const[k]of PARTS)s+=c.pc[k];return s/PARTS.length};
const condMin=c=>Math.min(...PARTS.map(([k])=>c.pc[k]));
const freshPC=()=>Object.fromEntries(PARTS.map(([k])=>[k,100]));
function lapTime(car,env,tr){
  const d=car.d,t=car.team,ty=car.tyre.c;
  let lt=tr.base+(100-carScore(t,tr))*.035+(100-d.pace)*.03+(60-d.morale)*.005+(1-car.setupQ)*.9;
  lt+=TYRES[ty].delta+wearPen(car.tyre.wear)+weatherPen(ty,env.w)*(1.25-d.wet/100*.5);
  lt+=[.45,0,-.35][car.mode]+[.3,0,-.25][car.eng]-focusGain(car.focus||0,tr);
  lt+=car.fuel*.035+(1-env.grip)*.8;
  const ca=condAvg(car);if(ca<70)lt+=(70-ca)*.02;
  lt+=(100-car.pc.frontWing)*.008;
  return lt+car.noise;
}
function grip(){return clamp(.55+RS.leaderLap/RS.laps*.4-RS.w*.5,.1,1)}
function chooseDry(car,stint,w,tr){for(const c of['soft','medium','hard']){if(72/wearRate({...car,mode:1},c,w,tr)>=stint)return c}return 'medium'}
const fuelTo=(car,tr)=>+Math.min(tr.cap,RS.laps-car.lapsDone+.6).toFixed(1);
// what a race engineer would call this lap: null or {c,rep,fuel,why}
function engineerCall(car,tr){
  const lapsLeft=RS.laps-car.lapsDone,w=RS.w,cur=car.tyre.c;
  if(lapsLeft<=1)return null;
  const f1=RS.wet[Math.min(RS.wet.length-1,RS.leaderLap+1)],f2=RS.wet[Math.min(RS.wet.length-1,RS.leaderLap+2)];
  const rep=condMin(car)<45&&lapsLeft>4,cat=TYRES[cur].cat,fuel=fuelTo(car,tr),stint=Math.min(lapsLeft,tr.cap);
  const dry=()=>chooseDry(car,stint,w,tr);
  if(cat==='dry'&&(w>.22||(w>.1&&f1>.3)))return {c:Math.max(w,f1)>.78?'wet':'inter',rep,fuel,why:'Rain is getting heavier'};
  if(cat!=='dry'&&w<.15&&f1<.15&&f2<.15)return {c:dry(),rep,fuel,why:'Track is drying'};
  if(cur==='inter'&&w>.82)return {c:'wet',rep,fuel,why:'Too wet for intermediates'};
  if(cur==='wet'&&w<.55&&f1<.7)return {c:'inter',rep,fuel,why:'Rain is easing'};
  if(car.fuel<1.7&&car.fuel<lapsLeft-.3)return {c:cat==='dry'&&car.tyre.wear>40?dry():(car.tyre.wear>40?cur:'keep'),rep,fuel,why:'Low on fuel'};
  if(cat==='dry'&&car.tyre.wear>car.wearThresh&&lapsLeft>3)return {c:dry(),rep,fuel,why:'Tyres are worn'};
  if(condMin(car)<30&&lapsLeft>5)return {c:'keep',rep:true,fuel,why:'Car needs repairs'};
  return null;
}

/* ---------- weekend ---------- */
function genWeather(tr){
  const out=[];let rain=Math.random()<tr.rain*.45,int=R(.35,.95);
  for(let l=0;l<=tr.laps+2;l++){
    if(!rain&&Math.random()<tr.rain*.1){rain=true;int=R(.3,.95)}
    else if(rain&&Math.random()<.09)rain=false;
    out.push(rain?+int.toFixed(2):0);
  }
  return out;
}
function startWeekend(){
  const tr=track();
  W={round:G.round,phase:'practice',wet:genWeather(tr),setup:{},quali:null,startTyre:{},startFuel:{},startFocus:{},setupQ:{}};
  for(const id of PT().drivers)W.setup[id]={v:[50,50,50],runs:0,fb:null,conf:null,off:[RI(-9,9),RI(-9,9),RI(-9,9)]};
  G.screen='weekend';save();render();
}
function setupQ(id){const s=W.setup[id],tr=track();let d=0;for(let i=0;i<3;i++)d+=Math.abs(s.v[i]-clamp(tr.opt[i]+s.off[i],0,100));return clamp(1-d/3/40,0,1)}
const SL=[['Wing level','Low downforce','High downforce','more wing','less wing'],['Gear ratios','Short','Long','longer gears','shorter gears'],['Suspension','Soft','Stiff','a stiffer car','a softer car']];
function practiceRun(id){
  const s=W.setup[id],tr=track();if(s.runs>=4)return;s.runs++;
  s.fb=s.v.map((v,i)=>{const o=clamp(tr.opt[i]+s.off[i],0,100),dd=Math.abs(v-o);
    const g=dd<5?['Perfect','good']:dd<12?['Good','good']:dd<25?['Okay','warn']:['Poor','bad'];
    return {g:g[0],cls:g[1],dir:dd<5?'':(v<o?SL[i][3]:SL[i][4])}});
  s.conf=setupQ(id);save();render();
}
function runQuali(){
  const tr=track(),env={w:W.wet[0],grip:.6},res=[];
  for(const t of G.teams)for(const id of t.drivers){
    const d=drv(id);const q=t.id==='P'?setupQ(id):R(.45,.9);W.setupQ[id]=q;
    const c=W.wet[0]<.2?'soft':bestTyreFor(W.wet[0]);
    const lt=lapTime({d,team:t,tyre:{c,wear:0},mode:2,eng:2,pc:freshPC(),fuel:2,setupQ:q,noise:gauss()*(1.1-d.consistency/100)*.5},env,tr);
    res.push({id,t:lt});
  }
  res.sort((a,b)=>a.t-b.t);W.quali=res;W.phase='quali';
  for(const id of PT().drivers){W.startTyre[id]=W.wet[0]<.2?'medium':bestTyreFor(W.wet[0]);W.startFuel[id]=Math.min(tr.cap,Math.ceil(tr.laps/2)+2);W.startFocus[id]=0}
  save();render();
}

/* ---------- race sim ---------- */
function startRace(){
  const tr=track();
  RS={t:0,laps:tr.laps,cars:[],sc:0,w:W.wet[0],wet:W.wet,leaderLap:0,leaderFin:false,over:false,feed:[],fastest:{t:Infinity,id:null},speed:10,tr};
  W.quali.forEach((q,i)=>{
    const d=drv(q.id),t=team(d.teamId),mine=t.id==='P';
    const c=mine?W.startTyre[q.id]:(W.wet[0]<.2?(Math.random()<.35?'soft':Math.random()<.85?'medium':'hard'):bestTyreFor(W.wet[0]));
    const fuel=mine?W.startFuel[q.id]:Math.min(tr.cap,Math.round(tr.laps*R(.42,.6))+1.5);
    RS.cars.push({id:q.id,d,team:t,mine,dist:-i*.003,lapsDone:0,lapStartT:0,tyre:{c,wear:0,age:0},pc:freshPC(),fuel,mode:1,eng:1,focus:mine?(W.startFocus[q.id]||0):(Math.random()<.75?bestFocus(tr):0),
      box:null,boxSel:c,rep:false,fuelT:null,pitT:0,pitTot:0,stall:0,dnf:null,fin:false,finT:0,last:null,best:null,cool:0,stops:0,grid:i+1,
      wearThresh:R(66,80),setupQ:W.setupQ[q.id]??.6,noise:(Math.random()-.5)*1.5,lt:tr.base,warned:{},side:i%2?1:-1,latT:0,lat:0,prevPos:i,pos:i});
  });
  W.phase='race';save();
  UI.sel=RS.cars.findIndex(c=>c.mine);UI.cam.k=0;UI.pop=[null,null];
  feed(`Lights out at ${tr.name}. ${RS.cars[0].d.name} leads from pole.`,'hot');
  render();
}
function feed(text,cls=''){RS.feed.unshift({lap:RS.leaderLap,text,cls});if(RS.feed.length>80)RS.feed.pop()}
function order(){return RS.cars.slice().sort((a,b)=>{
  if(!!a.dnf!==!!b.dnf)return a.dnf?1:-1;
  if(a.fin&&b.fin){const f=Math.floor(b.dist)-Math.floor(a.dist);return f||a.finT-b.finT}
  return b.dist-a.dist})}
function retire(car,why){
  if(car.dnf)return;car.dnf=why;feed(`${car.d.name} retires: ${why}.`,car.mine?'hot':'');
  if(!RS.sc&&RS.laps-RS.leaderLap>3&&Math.random()<.55){RS.sc=3;feed('Safety car deployed.','hot')}
}
function dmg(car,part,amt){car.pc[part]=Math.max(0,car.pc[part]-amt);if(car.pc[part]<=0)retire(car,FAIL[part])}
function step(dt){
  if(RS.over)return;
  const tr=RS.tr;RS.t+=dt;
  const target=RS.wet[Math.min(RS.wet.length-1,RS.leaderLap)];
  RS.w+=clamp(target-RS.w,-dt*.004,dt*.004);
  const env={w:RS.w,grip:grip()};
  const ord=order();let ahead=null;
  ord.forEach((c,i)=>c.pos=i);
  for(const car of ord){
    if(car.dnf||car.fin)continue;
    if(car.pitT>0){car.pitT-=dt;if(car.pitT<=0){car.dist+=PL;car.pitTot=0}continue}
    if(car.cool>0)car.cool-=dt;
    let lt=lapTime(car,env,tr);car.lt=lt;
    if(car.stall>0){car.stall-=dt;if(car.stall<=0)ahead=car;continue}
    let adv,nd;
    const near=ahead&&ahead.dist-car.dist<.5;
    car.latT=0;
    if(RS.sc){
      lt=tr.base*1.4;adv=dt/lt;
      if(near&&(ahead.dist-car.dist)*lt>.8)adv*=1.35;
      nd=car.dist+adv;
      if(near)nd=Math.max(car.dist,Math.min(nd,ahead.dist-.5/lt));
    }else{
      const gapS=near?(ahead.dist-car.dist)*lt:9;
      if(gapS<1)lt+=.12;
      if(gapS<.45)car.latT=car.side*.9;
      adv=dt/lt;nd=car.dist+adv;
      if(near){const minGap=.2/lt;
        if(nd>ahead.dist-minGap){
          const delta=ahead.lt-car.lt;let passed=false;
          if(car.cool<=0&&delta>.05){
            car.cool=1.8;
            const p=clamp(.04+delta*.3+(car.d.racecraft-ahead.d.racecraft)/250+(car.mode===2?.06:0)+ovtFocus[car.focus||0]-(ahead.mode===2?.03:0)-RS.w*.05,.01,.75)*tr.ovt;
            if(car.mine||ahead.mine)RS.comm=`${car.d.name} is attempting to overtake ${ahead.d.name}`;
            if(Math.random()<.005+RS.w*.01){
              if(car.mine||ahead.mine)feed(`Contact! ${car.d.name} hits ${ahead.d.name}.`,'hot');
              dmg(ahead,'rearWing',R(5,25));dmg(car,'suspension',R(0,15));dmg(car,'frontWing',R(15,45));
            }else if(Math.random()<p){
              passed=true;nd=ahead.dist+.0005;ahead.cool=1.5;
              if(car.mine||ahead.mine)feed(`${car.d.name} passes ${ahead.d.name}.`,car.mine?'me':'hot');
            }
          }
          if(!passed)nd=Math.max(car.dist,ahead.dist-minGap);
        }
      }
    }
    if(car.dnf)continue;
    const moved=nd-car.dist,rf=1.6-relOf(car)/100,eF=[.6,1,1.8][car.eng],dF=[.7,1,1.4][car.mode];
    car.tyre.wear=Math.min(100,car.tyre.wear+moved*wearRate(car,car.tyre.c,RS.w,tr)*(RS.sc?.3:1));
    car.fuel-=moved*[.85,1,1.18][car.eng]*fuelFocus[car.focus||0]*(RS.sc?.6:1);
    const pr=car.team.parts;
    car.pc.engine-=moved*2.1*eF*(1.6-pr.engine.rel/100);car.pc.gearbox-=moved*1.6*eF*(1.6-pr.gearbox.rel/100);
    car.pc.brakes-=moved*1.7*dF*(1.6-pr.brakes.rel/100);car.pc.suspension-=moved*1.4*dF*(1.6-pr.suspension.rel/100);
    car.pc.frontWing-=moved*.55*(1.6-pr.frontWing.rel/100);car.pc.rearWing-=moved*.55*(1.6-pr.rearWing.rel/100);
    if(car.fuel<=0){car.fuel=0;retire(car,'out of fuel');continue}
    const prev=car.dist;car.dist=nd;
    if(Math.floor(nd)>Math.floor(prev)&&Math.floor(nd)>=1)crossLine(car);
    if(!car.dnf&&!car.fin&&car.pitT<=0&&car.stall<=0)ahead=car;
  }
  if(RS.cars.every(c=>c.dnf||c.fin)){RS.over=true;feed('Chequered flag. Race over.','hot')}
}
function relOf(car){let s=0;for(const[k]of PARTS)s+=car.team.parts[k].rel;return s/PARTS.length}
function crossLine(car){
  const tr=RS.tr;
  const lt=RS.t-car.lapStartT;car.lapStartT=RS.t;car.lapsDone=Math.floor(car.dist);car.tyre.age++;
  if(!car.inPitLap){car.last=lt;if(!car.best||lt<car.best)car.best=lt;if(lt<RS.fastest.t){RS.fastest={t:lt,id:car.id};if(RS.leaderLap>1)RS.comm=`${car.d.name} sets the fastest lap: ${fmtT(lt)}`}}
  car.inPitLap=false;
  car.noise=gauss()*(1.1-car.d.consistency/100)*.6;
  if(car.lapsDone>RS.leaderLap){RS.leaderLap=car.lapsDone;
    for(const c of RS.cars)c.prevPos=c.pos;
    if(RS.sc){RS.sc--;if(!RS.sc)feed('Safety car in. Racing resumes.','hot')}
    else if(RS.laps-RS.leaderLap>4&&Math.random()<.025+RS.w*.05){RS.sc=RI(2,3);feed(pick(['Debris on track.','A car is stopped at turn 4.','Barrier repairs needed.'])+' Safety car deployed.','hot')}
    const nx=RS.wet[Math.min(RS.wet.length-1,RS.leaderLap+2)];
    if(nx>.15&&RS.w<.1&&!RS.rainWarn){RS.rainWarn=true;feed('Radio: rain expected within two laps.','hot')}
    if(nx<.05&&RS.w>.3)RS.rainWarn=false;
  }
  if(RS.leaderFin||car.lapsDone>=RS.laps){car.fin=true;car.finT=RS.t;if(!RS.leaderFin){RS.leaderFin=true;feed(`${car.d.name} wins the ${tr.name} Grand Prix!`,'hot')}return}
  const lapsLeft=RS.laps-car.lapsDone;
  for(const[k]of PARTS){const p=car.pc[k];if((p<50&&Math.random()<(50-p)/50*.06)||Math.random()<.00025*(1.8-car.team.parts[k].rel/100)){retire(car,FAIL[k]);return}}
  const spin=.004+(100-car.d.consistency)/100*.015+(car.mode===2?.008:0)+RS.w*.03*(1-car.d.wet/100)+(TYRES[car.tyre.c].cat==='dry'?RS.w*.05:0);
  if(!RS.sc&&Math.random()<spin){
    if(Math.random()<.15){feed(`${car.d.name} spins and damages the car.`,car.mine?'hot':'');dmg(car,pick(['suspension','frontWing','rearWing']),R(20,50));if(car.dnf)return}
    else if(car.mine)feed(`${car.d.name} runs wide and loses time.`,'me');
    car.stall=R(2.5,7);
  }
  if(!car.mine){
    const call=engineerCall(car,tr);if(call)car.box=call;
    car.mode=car.tyre.wear>62?0:1;
    if(!car.box&&lapsLeft<=5&&condMin(car)>45)car.mode=2;
    car.eng=car.fuel<lapsLeft&&car.fuel>lapsLeft-1.5?0:(lapsLeft<=5&&condMin(car)>50&&car.fuel>lapsLeft*1.2+.5?2:(condMin(car)<45?0:1));
  }else{
    if(car.tyre.wear>70&&!car.warned.wear){car.warned.wear=1;feed(`Radio ${car.d.code}: "Tyres are going off."`,'me')}
    if(condMin(car)<45&&!car.warned.cond){car.warned.cond=1;feed(`Radio ${car.d.code}: "Something doesn't feel right with the car."`,'hot')}
    if(car.fuel<2.2&&car.fuel<lapsLeft&&!car.warned.fuel){car.warned.fuel=1;feed(`Radio ${car.d.code}: "Fuel is getting low. Two laps left."`,'hot')}
  }
  if(car.box){
    const b=car.box;car.box=null;
    let work=0;
    if(b.c!=='keep'){work=2.4+R(0,.8);car.tyre={c:b.c,wear:0,age:0};car.warned.wear=0}
    const tgt=b.fuel??fuelTo(car,tr),add=Math.max(0,tgt-car.fuel);
    if(add>0){work=Math.max(work,1.5+add*.3);car.fuel+=add;car.warned.fuel=0}
    if(b.rep){let def=0;for(const[k]of PARTS){def+=100-car.pc[k];car.pc[k]=100}work+=def*.02;car.warned.cond=0}
    work=Math.max(work,2);
    let tm=Math.max(3,tr.pit*(RS.sc?.55:1)-PL*tr.base)+work;
    if(Math.random()<.03){tm+=R(3,7);feed(`Slow stop for ${car.d.name}.`,car.mine?'hot':'')}
    car.stops++;car.pitT=tm;car.pitTot=tm;car.inPitLap=true;
    if(car.mine){car.rep=false;car.fuelT=null;if(b.c!=='keep')car.boxSel=b.c}
    feed(`${car.d.name} pits${b.c!=='keep'?' for '+TYRES[b.c].n:''}${add>0?`, +${add.toFixed(1)} laps fuel`:''}${b.rep?', repairs':''} (${work.toFixed(1)}s stationary).`,car.mine?'me':'');
  }
}

/* ---------- results & season ---------- */
function teamRank(){return G.teams.slice().sort((a,b)=>carAvg(b)-carAvg(a)).map(t=>t.id)}
function sponsorTarget(){return clamp(teamRank().indexOf('P')*2+1,1,12)}
function finishRace(){
  const o=order(),pt=PT(),tr=RS.tr;
  const rank=teamRank();const res=[];let pts=0,best=99;
  o.forEach((c,i)=>{
    const p=!c.dnf&&i<10?POINTS[i]:0;
    c.d.points+=p;c.team.points+=p;if(i===0&&!c.dnf)c.d.wins++;if(i<3&&!c.dnf)c.d.podiums++;
    if(c.mine){pts+=p;if(!c.dnf)best=Math.min(best,i+1);
      const exp=rank.indexOf('P')*2+1.5;let dm=c.dnf?-4:clamp(Math.round((exp-(i+1))*1.5),-8,8);
      c.d.morale=clamp(c.d.morale+dm,0,100)}
    res.push({id:c.id,pos:i+1,pts:p,dnf:c.dnf,laps:c.lapsDone,stops:c.stops,best:c.best,grid:c.grid,fl:RS.fastest.id===c.id});
  });
  const mine=o.filter(c=>c.mine);
  if(mine.length===2&&!mine[0].dnf){mine[0].d.morale=clamp(mine[0].d.morale+2,0,100);mine[1].d.morale=clamp(mine[1].d.morale-2,0,100)}
  const target=sponsorTarget();
  const fin={sponsor:pt.sponsor,bonus:best<=target?.6e6*SER().cost:0,prize:pts*SER().ppp*1e6,salaries:-pt.drivers.reduce((s,id)=>s+drv(id).salary,0)/TRACKS.length,running:-pt.running,staff:-G.staff.reduce((a,e)=>a+engSalary(e),0)/TRACKS.length,fine:0,project:''};
  for(const[k,n]of PARTS){const p=pt.parts[k];if(p.risky&&Math.random()<.14){const f=1.5e6*SER().cost;p.risky=false;p.perf=Math.max(20,p.perf-8);fin.fine-=f;fin.project+=`Scrutineers found your ${n.toLowerCase()} outside the rules: fined ${money(f)}, part rebuilt to legal spec. `}}
  for(const pj of G.projects.slice()){pj.left--;if(pj.left<=0){const p=pt.parts[pj.part];
    if(pj.kind==='rel'){p.rel=clamp(p.rel+pj.rel,0,99);fin.project+=`Reliability upgrade fitted to the ${pj.name.toLowerCase()} (+${pj.rel}). `}
    else{p.perf=clamp(p.perf+pj.perf,0,99);p.rel=pj.rel;p.risky=pj.kind==='grey';fin.project+=`New ${pj.name.toLowerCase()} fitted: +${pj.perf} performance, ${pj.rel} reliability. `}
    G.projects.splice(G.projects.indexOf(pj),1)}}
  const net=Object.values(fin).filter(v=>typeof v==='number').reduce((a,b)=>a+b,0);G.budget+=net;
  for(const t of G.series.flat())if(t.id!=='P'&&Math.random()<.45+t.tier*.35){const k=pick(PARTS)[0];t.parts[k].perf=clamp(t.parts[k].perf+RI(1,3+Math.round(t.tier*2)),0,99)}
  simOtherSeries();
  const winner=o[0];
  G.history.push({round:G.round,track:tr.name,winner:winner.d.name,wcolor:winner.team.color});
  const qs=QUESTIONS[RI(0,QUESTIONS.length-1)];
  const bd=mine.slice().sort((a,b)=>o.indexOf(a)-o.indexOf(b))[0];
  G.last={res,fin,net,best,target,q:qs,bestId:bd?bd.id:pt.drivers[0],answered:null,track:tr.name,round:G.round};
  G.round++;W=null;RS=null;G.screen='results';save();render();
}
function answer(i){
  const L=G.last;if(L.answered!=null)return;L.answered=i;const e=L.q.a[i][1];
  for(const id of PT().drivers){const d=drv(id);let dm=e.both||0;if(id===L.bestId&&e.best)dm=e.best;if(id!==L.bestId&&e.other)dm=e.other;d.morale=clamp(d.morale+dm,0,100)}
  save();render();
}
function afterResults(){
  if(G.round>=TRACKS.length){G.screen='season';save();render();return}
  G.screen='hub';UI.tab='overview';save();render();
}
// the races in the other two championships, resolved quickly from car and driver strength
function simOtherSeries(){
  G.series.forEach((list,lvl)=>{if(lvl===G.tier)return;
    const es=[];for(const t of list)for(const id of t.drivers){const d=drv(id);es.push({d,t,s:carAvg(t)+d.pace*.85+gauss()*7,dnf:Math.random()<.06})}
    es.sort((a,b)=>(a.dnf-b.dnf)||b.s-a.s);
    es.forEach((e,i)=>{if(e.dnf)return;const p=i<10?POINTS[i]:0;e.d.points+=p;e.t.points+=p;if(i===0)e.d.wins++;if(i<3)e.d.podiums++});
  });
}
function standingsD(lvl=G.tier){const ids=new Set(G.series[lvl].map(t=>t.id));return Object.values(G.drivers).filter(d=>ids.has(d.teamId)).sort((a,b)=>b.points-a.points||b.wins-a.wins)}
function standingsT(lvl=G.tier){return G.series[lvl].slice().sort((a,b)=>b.points-a.points)}
const PRIZE=[8,6.5,5,4,3,2.5,2,1.5];
// top 2 of each lower championship go up, bottom 2 of each upper one go down
function seasonMoves(){const mv=[];for(let l=0;l<2;l++){standingsT(l).slice(-2).forEach(t=>mv.push({id:t.id,from:l,to:l+1}));standingsT(l+1).slice(0,2).forEach(t=>mv.push({id:t.id,from:l+1,to:l}))}return mv}
function newSeason(){
  if(DEMO)return;
  const st=standingsT(),pos=st.findIndex(t=>t.id==='P');
  const prize=PRIZE[pos]*SER().prize*1e6;G.budget+=prize;
  const mv=seasonMoves(),me=mv.find(m=>m.id==='P');let msg='';
  G.seasonLog.push({season:G.season,series:SER().short,champ:standingsD()[0].name,team:st[0].name,me:pos+1,move:me?(me.to<me.from?'up':'down'):''});
  for(const m of mv){const t=team(m.id);G.series[m.from].splice(G.series[m.from].indexOf(t),1);G.series[m.to].push(t);if(m.id!=='P')t.tier=m.to<m.from?R(.25,.4):R(.6,.8)}
  if(me){G.tier=me.to;const up=me.to<me.from,pt=PT();Object.assign(pt,econ(G.tier,up?.35:.7));
    const bonus=SERIES[G.tier].budget[0]*(up?.4:.3)*1e6;G.budget+=bonus;
    msg=up?`Promoted to the ${SER().name}! ${money(bonus)} promotion bonus.`:`Relegated to the ${SER().name}. ${money(bonus)} parachute payment.`}
  G.teams=G.series[G.tier];for(const k in WORLDS)delete WORLDS[k];
  for(const t of G.series.flat()){t.points=0;for(const[k]of PARTS){t.parts[k].perf=Math.round(t.parts[k].perf*.93);t.parts[k].risky=false}}
  const left=[];
  for(const d of Object.values(G.drivers)){d.points=0;d.age++;
    const g=d.age<26?R(0,3):d.age>32?R(-3,0):R(-1,1.5);for(const k of['pace','racecraft','tyre','consistency','wet'])d[k]=clamp(Math.round(d[k]+g+R(-1,1)),35,99);
    if(d.teamId==='P'&&d.morale<20)left.push(d)}
  for(const d of left){const t=PT(),i=t.drivers.indexOf(d.id);const nd=G.drivers[G.market.shift()];t.drivers[i]=nd.id;nd.teamId='P';d.teamId=null;G.market.push(d.id);d.morale=60}
  const nm=nameGen();while(G.market.length<6){const d=mkDriver(nm(),lerp(...SER().drv,R(.2,1)));d.num=60+G.nid;G.market.push(d.id)}
  G.engMarket=engMarket();
  G.season++;G.round=0;G.history=[];G.screen='hub';UI.tab='overview';save();render();
  const notes=[msg,left.length?`${left.map(d=>d.name).join(' and ')} quit over low morale. Replaced from the market.`:''].filter(Boolean);
  if(notes.length)toast(notes.join(' '));
}

/* ---------- design & market ---------- */
const DESIGNS={
  safe:{n:'Conservative',cost:1.1e6,races:2,perf:[3,6],rel:[80,90],txt:'Proven concept. Small gain, very reliable.'},
  bold:{n:'Ambitious',cost:1.9e6,races:3,perf:[6,11],rel:[55,75],txt:'Bigger step. Reliability will suffer at first.'},
  grey:{n:'Grey area',cost:2.4e6,races:3,perf:[10,15],rel:[50,70],txt:'Bends the rules. Scrutineers may fine you each race.'}};
/* staff engineers: each one hired adds a design slot, so several parts can be built at once.
   Better engineers find extra performance and build faster. They are expensive. */
const MAX_STAFF=2;
const engSalary=e=>Math.round(e.base*SER().cost*20)/20*1e6;   // per season, scales with tier
const engFee=e=>engSalary(e);                                  // signing fee: a full season up front
const engBonus=e=>({perf:Math.floor(e.stars/2),faster:e.stars>=4?1:0,rel:e.stars*2});
function engMarket(){const nm=nameGen();return [0,1,2].map(()=>{const stars=RI(1,5);return{id:'e'+(G.nid++),name:nm(),stars,base:+(1.2+stars*.6+R(-.15,.15)).toFixed(2)}})}
const slots=()=>1+G.staff.length;
const busy=id=>G.projects.some(p=>p.eng===id);
function nextDesigner(){const free=G.staff.filter(e=>!busy(e.id)).sort((a,b)=>b.stars-a.stars)[0];if(free)return free;return busy(null)?undefined:null}
function startDesign(kind){
  if(G.projects.length>=slots())return toast('All design slots are busy. Hire an engineer to build more parts at once.');
  const part=UI.dpart,name=PNAME[part];
  if(G.projects.some(p=>p.part===part))return toast(`The ${name.toLowerCase()} is already being worked on.`);
  const eng=nextDesigner();if(eng===undefined)return toast('No designer is free.');
  const b=eng?engBonus(eng):{perf:0,faster:0,rel:0};
  if(kind==='rel'){const c=.6e6*SER().cost;if(G.budget<c)return toast('Not enough budget.');G.budget-=c;G.projects.push({part,name,kind,left:1,rel:RI(10,18)+b.rel,total:1,eng:eng?eng.id:null})}
  else{const D=DESIGNS[kind],c=D.cost*SER().cost;if(G.budget<c)return toast('Not enough budget.');G.budget-=c;
    const races=Math.max(1,D.races-b.faster);G.projects.push({part,name,kind,left:races,total:races,perf:RI(...D.perf)+b.perf,rel:Math.min(99,RI(...D.rel)+b.rel),eng:eng?eng.id:null})}
  const pj=G.projects[G.projects.length-1];
  save();render();toast(`${eng?eng.name:'Chief designer'} starts the ${name.toLowerCase()}. Ready in ${pj.left} race${pj.left>1?'s':''}.`);
}
function hireEng(id){
  const e=G.engMarket.find(x=>x.id===id);if(!e)return;
  if(G.staff.length>=MAX_STAFF)return toast(`You can employ at most ${MAX_STAFF} engineers.`);
  const fee=engFee(e);if(G.budget<fee)return toast('Not enough budget for the signing fee.');
  G.budget-=fee;G.staff.push(e);G.engMarket=G.engMarket.filter(x=>x!==e);save();render();toast(`${e.name} joins the design office. Signing fee ${money(fee)}.`);
}
function fireEng(id){if(busy(id))return toast('That engineer is still working on a part.');const e=G.staff.find(x=>x.id===id);G.staff=G.staff.filter(x=>x.id!==id);save();render();toast(`${e.name} has left the team.`)}
function sign(fid,seat){
  const nd=drv(fid),t=PT(),old=drv(t.drivers[seat]),fee=nd.salary*.5;
  if(G.budget<fee)return toast('Not enough budget for the signing fee.');
  G.budget-=fee;G.market=G.market.filter(x=>x!==fid);G.market.push(old.id);old.teamId=null;nd.teamId='P';t.drivers[seat]=nd.id;nd.morale=clamp(nd.morale+10,0,100);
  save();render();toast(`${nd.name} signed. ${old.name} released.`);
}
function toast(msg){let el=$('.toast');if(!el){el=document.createElement('div');el.className='toast';el.setAttribute('role','status');document.body.appendChild(el)}el.textContent=msg;clearTimeout(UI.toastT);UI.toastT=setTimeout(()=>el.remove(),3200)}

/* ---------- track geometry ---------- */
const PATHS={};
function path(i){
  if(PATHS[i])return PATHS[i];
  const pts=TRACKS[i].pts,n=pts.length,P=[];
  for(let j=0;j<n;j++){const p0=pts[(j-1+n)%n],p1=pts[j],p2=pts[(j+1)%n],p3=pts[(j+2)%n];
    for(let s=0;s<30;s++){const t=s/30,t2=t*t,t3=t2*t;
      const f=(a,b,c,d)=>.5*(2*b+(-a+c)*t+(2*a-5*b+4*c-d)*t2+(-a+3*b-3*c+d)*t3);
      P.push([f(p0[0],p1[0],p2[0],p3[0]),f(p0[1],p1[1],p2[1],p3[1])])}}
  const L=[0];for(let j=1;j<=P.length;j++){const a=P[j-1],b=P[j%P.length];L.push(L[j-1]+Math.hypot(b[0]-a[0],b[1]-a[1]))}
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const[x,y]of P){x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y)}
  return PATHS[i]={P,L,total:L[L.length-1],x0,y0,x1,y1};
}
function posAt(pa,f){
  f=((f%1)+1)%1;const tg=f*pa.total;let lo=0,hi=pa.L.length-1;
  while(hi-lo>1){const m=(lo+hi)>>1;if(pa.L[m]<=tg)lo=m;else hi=m}
  const a=pa.P[lo],b=pa.P[(lo+1)%pa.P.length],seg=pa.L[lo+1]-pa.L[lo]||1,u=(tg-pa.L[lo])/seg;
  return [a[0]+(b[0]-a[0])*u,a[1]+(b[1]-a[1])*u];
}
function frame(pa,f){const a=posAt(pa,f),b=posAt(pa,f+.002),dx=b[0]-a[0],dy=b[1]-a[1],l=Math.hypot(dx,dy)||1;return{x:a[0],y:a[1],ang:Math.atan2(dy,dx),nx:-dy/l,ny:dx/l}}
function fitter(pa,w,h,pad){const s=Math.min((w-2*pad)/(pa.x1-pa.x0),(h-2*pad)/(pa.y1-pa.y0));const ox=(w-(pa.x1-pa.x0)*s)/2-pa.x0*s,oy=(h-(pa.y1-pa.y0)*s)/2-pa.y0*s;return([x,y])=>[x*s+ox,y*s+oy]}
function drawOutline(ctx,i,w,h,pad,lw,col){
  const pa=path(i),T=fitter(pa,w,h,pad);
  ctx.lineJoin='round';ctx.lineCap='round';ctx.beginPath();pa.P.forEach((p,j)=>{const[x,y]=T(p);j?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.closePath();
  ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.stroke();return T;
}
/* ---------- stylised world (painted once per track) ---------- */
const TW=4.4; // track width in world units
const THEMES={
  forest:{ground:'#2c4426',g2:'#35502c',g3:'#253b20',tree:['#1f3a1c','#2a4a24','#335a2a'],trees:950,bld:20,palm:false},
  city:{ground:'#3b4045',g2:'#454b51',g3:'#33383d',tree:['#2a4a28','#36592f'],trees:140,bld:260,palm:false},
  desert:{ground:'#b39563',g2:'#c2a571',g3:'#a3855a',tree:['#55703a','#6a8644'],trees:70,bld:40,palm:true},
  coast:{ground:'#3e5a37',g2:'#4a6941',g3:'#354e2f',tree:['#2b4d29','#3c6334'],trees:260,bld:120,palm:true}};
const WORLDS={};
function world(i){
  if(WORLDS[i])return WORLDS[i];
  const tr=TRACKS[i],pa=path(i),th=THEMES[tr.theme],r=rng(i*977+13),m=16;
  const x0=pa.x0-m,y0=pa.y0-m,x1=pa.x1+m,y1=pa.y1+m,PX=18;
  const cv=document.createElement('canvas');cv.width=Math.ceil((x1-x0)*PX);cv.height=Math.ceil((y1-y0)*PX);
  const c=cv.getContext('2d');c.setTransform(PX,0,0,PX,-x0*PX,-y0*PX);
  c.fillStyle=th.ground;c.fillRect(x0,y0,x1-x0,y1-y0);
  for(let k=0;k<420;k++){c.fillStyle=r()<.5?th.g2:th.g3;c.globalAlpha=.5;c.beginPath();c.ellipse(x0+r()*(x1-x0),y0+r()*(y1-y0),2+r()*7,1+r()*4,r()*3,0,7);c.fill()}
  c.globalAlpha=1;
  const samp=pa.P.filter((_,j)=>j%2===0);
  const near=(x,y,d)=>{for(const p of samp){if((p[0]-x)**2+(p[1]-y)**2<d*d)return true}return false};
  let inSea=()=>false;
  if(tr.sea){
    const wave=(t)=>Math.sin(t*.25)*1.6+Math.sin(t*.07)*2.5;
    const S=tr.sea;
    const edge=S==='S'?pa.y1+4:S==='N'?pa.y0-4:S==='E'?pa.x1+4:pa.x0-4;
    inSea=(x,y)=>S==='S'?y>edge+wave(x):S==='N'?y<edge+wave(x):S==='E'?x>edge+wave(y):x<edge+wave(y);
    const draw=(off,col)=>{c.fillStyle=col;c.beginPath();
      if(S==='S'||S==='N'){const yy=S==='S'?y1:y0;c.moveTo(x0,yy);for(let x=x0;x<=x1;x+=1)c.lineTo(x,edge+wave(x)+(S==='S'?off:-off));c.lineTo(x1,yy)}
      else{const xx=S==='E'?x1:x0;c.moveTo(xx,y0);for(let y=y0;y<=y1;y+=1)c.lineTo(edge+wave(y)+(S==='E'?off:-off),y);c.lineTo(xx,y1)}
      c.closePath();c.fill()};
    draw(-1.8,'#cdbb8a');draw(0,'#1d6079');draw(2.5,'#195570');draw(6,'#164a63');
  }
  // buildings
  for(let k=0;k<th.bld;k++){const x=x0+r()*(x1-x0),y=y0+r()*(y1-y0),w=2+r()*6,h=2+r()*5;
    if(near(x,y,TW+Math.max(w,h)*.8)||inSea(x,y))continue;
    c.save();c.translate(x,y);c.rotate((r()<.6?0:Math.PI/2)+(r()-.5)*.3);
    c.fillStyle='rgba(0,0,0,.28)';c.fillRect(-w/2+.5,-h/2+.6,w,h);
    const g=170+Math.floor(r()*60);c.fillStyle=`rgb(${g},${g+4},${g+8})`;c.fillRect(-w/2,-h/2,w,h);
    c.fillStyle='rgba(0,0,0,.08)';c.fillRect(-w/2,-h/2,w,h*.35);c.restore()}
  // trees
  for(let k=0;k<th.trees;k++){const x=x0+r()*(x1-x0),y=y0+r()*(y1-y0);if(near(x,y,TW+2.2)||inSea(x,y))continue;
    const s=th.palm?.55+r()*.3:.7+r()*.9;
    c.fillStyle='rgba(0,0,0,.3)';c.beginPath();c.ellipse(x+s*.45,y+s*.5,s,s*.8,0,0,7);c.fill();
    c.fillStyle=th.tree[Math.floor(r()*th.tree.length)];c.beginPath();
    if(th.palm){for(let a=0;a<6;a++){c.ellipse(x+Math.cos(a)*s*.6,y+Math.sin(a)*s*.6,s*.7,s*.22,a,0,7)}}else c.arc(x,y,s,0,7);
    c.fill();c.fillStyle='rgba(255,255,255,.07)';c.beginPath();c.arc(x-s*.25,y-s*.25,s*.45,0,7);c.fill()}
  // grandstands + pit building along the start straight
  const ps=tr.ps;
  for(let f=.004;f<.05;f+=.0055){const F=frame(pa,f);
    c.save();c.translate(F.x+F.nx*ps*(TW/2+5.6),F.y+F.ny*ps*(TW/2+5.6));c.rotate(F.ang);c.fillStyle='rgba(0,0,0,.3)';c.fillRect(-1.4,-1+.4,2.9,2.2);c.fillStyle='#d9dee2';c.fillRect(-1.5,-1.1,3,2.2);c.restore();
    c.save();c.translate(F.x-F.nx*ps*(TW/2+3),F.y-F.ny*ps*(TW/2+3));c.rotate(F.ang);c.fillStyle='rgba(0,0,0,.3)';c.fillRect(-1.4,-1,2.9,2.6);
    for(let s=0;s<5;s++){c.fillStyle=s%2?'#5a6b78':'#7d8f9c';c.fillRect(-1.5,-1.2+s*.5,3,.5)}c.restore()}
  // track layers
  const trace=(off=0)=>{c.beginPath();pa.P.forEach((p,j)=>{j?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1])});c.closePath()};
  c.lineJoin='round';c.lineCap='round';
  trace();c.strokeStyle='rgba(120,140,110,.55)';c.lineWidth=TW+3.2;c.stroke();
  // kerbs at corners
  const n=pa.P.length;
  for(let j=0;j<n;j++){const a=pa.P[(j-3+n)%n],b=pa.P[j],d=pa.P[(j+3)%n];
    const a1=Math.atan2(b[1]-a[1],b[0]-a[0]),a2=Math.atan2(d[1]-b[1],d[0]-b[0]);let da=Math.abs(a2-a1);if(da>Math.PI)da=2*Math.PI-da;
    if(da>.16){const e=pa.P[(j+1)%n];c.beginPath();c.moveTo(b[0],b[1]);c.lineTo(e[0],e[1]);c.strokeStyle=j%2?'#d23b3b':'#f1f1f1';c.lineWidth=TW+1.1;c.lineCap='butt';c.stroke()}}
  c.lineCap='round';
  trace();c.strokeStyle='#e7ecef';c.lineWidth=TW+.4;c.stroke();
  trace();c.strokeStyle='#3a3f45';c.lineWidth=TW;c.stroke();
  trace();c.strokeStyle='rgba(0,0,0,.18)';c.lineWidth=1.4;c.stroke();
  // pit lane
  c.beginPath();for(let f=-.008;f<=PL+.008;f+=.0008){const F=frame(pa,f),o=ps*(TW/2+1.5)*Math.min(1,(f+.008)/.01,(PL+.008-f)/.01);const x=F.x+F.nx*o,y=F.y+F.ny*o;f<-.0075?c.moveTo(x,y):c.lineTo(x,y)}
  c.strokeStyle='#e7ecef';c.lineWidth=1.75;c.stroke();c.strokeStyle='#45494f';c.lineWidth=1.5;c.stroke();
  G&&G.teams.forEach((t,k)=>{const F=frame(pa,.012+k*.0042);c.save();c.translate(F.x+F.nx*ps*(TW/2+2.75),F.y+F.ny*ps*(TW/2+2.75));c.rotate(F.ang);c.fillStyle=t.color;c.fillRect(-.6,-.4,1.2,.8);c.restore()});
  // start line + grid
  {const F=frame(pa,0);c.save();c.translate(F.x,F.y);c.rotate(F.ang);for(let k=0;k<8;k++)for(let mm=0;mm<2;mm++){c.fillStyle=(k+mm)%2?'#fff':'#111';c.fillRect(mm*.35-.35,-TW/2+k*TW/8,.35,TW/8)}c.restore();
   for(let g=1;g<=16;g++){const F2=frame(pa,-g*.003);c.save();c.translate(F2.x+F2.nx*(g%2?1:-1)*TW*.22,F2.y+F2.ny*(g%2?1:-1)*TW*.22);c.rotate(F2.ang);c.fillStyle='rgba(255,255,255,.7)';c.fillRect(-.05,-.5,.12,1);c.restore()}}
  return WORLDS[i]={cv,PX,x0,y0,x1,y1,bg:th.ground};
}

function render(){
  cancelAnimationFrame(UI.raf);
  document.body.classList.toggle('hasnav',!!(G&&G.screen==='hub'));
  document.body.classList.toggle('racing',!!(G&&G.screen==='weekend'&&W&&W.phase==='race'));
  if(!G){return UI.picking?renderTeamSelect():renderTitle()}
  if(G.screen==='hub')return renderHub();

function renderTitle(){
  app.innerHTML=`<div class="title">

function carPos(c,pa){

function drawCar(ctx,x,y,a,k,col,sel,mine){

  ctx.fillStyle='#111';for(const sx of[-.32,.3])for(const sy of[-.5,.5])ctx.fillRect(sx*L-L*.08,sy*Wd-Wd*.16,L*.16,Wd*.32);

}
function drawRace(dtReal){
  const cv=$('#cv');if(!cv)return;const ctx=cv.getContext('2d'),w=cv.width,h=cv.height,dpr=UI.dpr;
  const wd=world(G.round),pa=path(G.round),cam=UI.cam;
  for(const c of RS.cars)c.lat+=(c.latT-c.lat)*Math.min(1,dtReal*2);
  const tgt=RS.cars[UI.sel]||RS.cars[0];const tp=carPos(tgt,pa);
  const fitK=Math.min(w/(wd.x1-wd.x0-14),h/(wd.y1-wd.y0-14));
  const follow=cam.mode==='follow';
  const tk=follow?Math.max(fitK*1.8,w/62):fitK,tx=follow?tp.x:(wd.x0+wd.x1)/2,ty=follow?tp.y:(wd.y0+wd.y1)/2;
  if(!cam.k){cam.k=tk;cam.x=tx;cam.y=ty}
  const a=Math.min(1,dtReal*3.5);cam.k+=(tk-cam.k)*a;
  if(cam.lastSel!==UI.sel||cam.lastMode!==cam.mode){cam.blend=1;cam.lastSel=UI.sel;cam.lastMode=cam.mode}
  if(cam.blend>0){cam.blend=Math.max(0,cam.blend-dtReal*1.6);cam.x+=(tx-cam.x)*a;cam.y+=(ty-cam.y)*a}else{cam.x=tx;cam.y=ty}
  const k=cam.k,ox=w/2-(cam.x-wd.x0)*k,oy=h/2-(cam.y-wd.y0)*k;
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle=wd.bg;ctx.fillRect(0,0,w,h);
  ctx.imageSmoothingEnabled=true;ctx.setTransform(k/wd.PX,0,0,k/wd.PX,ox,oy);ctx.drawImage(wd.cv,0,0);ctx.setTransform(1,0,0,1,0,0);
  const S=(x,y)=>[(x-wd.x0)*k+ox,(y-wd.y0)*k+oy];
  const o=order(),zoomed=k>fitK*1.35;
  UI.sp={};
  for(let i=o.length-1;i>=0;i--){const c=o[i];if(c.dnf&&c.lapsDone<RS.leaderLap-1)continue;
    const p=carPos(c,pa);const[sx,sy]=S(p.x,p.y);UI.sp[c.id]=[sx/dpr,sy/dpr];
    if(sx<-60||sy<-60||sx>w+60||sy>h+60)continue;
    const col=c.dnf?'#555':c.team.color;
    if(zoomed)drawCar(ctx,sx,sy,p.a,k,col,c===tgt,c.mine);
    else{const r=(c.mine?8:6.5)*dpr;ctx.beginPath();ctx.arc(sx,sy,r,0,7);ctx.fillStyle=col;ctx.fill();ctx.lineWidth=(c===tgt?2.5:1.2)*dpr;ctx.strokeStyle=c===tgt?'#fff':'#0b151c';ctx.stroke();
      ctx.fillStyle='#08131a';ctx.font=`700 ${8*dpr}px "JetBrains Mono",monospace`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(i+1,sx,sy+.5)}
  }
  if(RS.w>.04){ctx.fillStyle=`rgba(40,80,120,${RS.w*.18})`;ctx.fillRect(0,0,w,h);ctx.strokeStyle='rgba(200,220,255,.28)';ctx.lineWidth=dpr;ctx.beginPath();
    for(let n=0;n<RS.w*160;n++){const x=Math.random()*w,y=Math.random()*h;ctx.moveTo(x,y);ctx.lineTo(x-4*dpr,y+14*dpr)}ctx.stroke()}
  // floating labels
  const lbl=$('#lbl'),sp=UI.sp[tgt.id];
  if(sp&&!tgt.dnf){lbl.style.transform=`translate(${sp[0]-14}px,${sp[1]-lbl.offsetHeight-6}px)`}else lbl.style.transform='translate(-9999px,0)';
  const pos=o.indexOf(tgt);
  [['na',o[pos-1]],['nb',o[pos+1]]].forEach(([id,c],j)=>{const el=$('#'+id),s=c&&!c.dnf&&UI.sp[c.id];
    if(s&&zoomed&&Math.hypot(s[0]-sp[0],s[1]-sp[1])<400){el.style.setProperty('--tc',c.team.color);el.textContent=ord(pos+(j?2:0));el.style.transform=`translate(${s[0]-10}px,${s[1]-38}px)`}else el.style.transform='translate(-9999px,0)'});
}

  $('#scb').hidden=!RS.sc;$('#over').hidden=!RS.over;
  for(const id of['follow','track'])$('#cam-'+id).classList.toggle('on',UI.cam.mode===id);
  const cm=RS.comm||(RS.feed[0]&&RS.feed[0].text)||'';$('#comm').textContent=cm;$('#comm').hidden=!cm;
  // standings
  $('#stand').innerHTML=`<div class="sh"><span>Standings</span><span class="muted">Tyre · Stops · Gap</span></div>`+o.map((c,i)=>{
    const d=c.prevPos-i,ar=d>0?'<span class="ar good">▲</span>':d<0?'<span class="ar bad">▼</span>':'<span></span>';
    const gap=i===0?(c.fin?'FIN':'–'):c.dnf?'<span class="tag out">OUT</span>':c.pitT>0?'<span class="tag pit">PIT</span>':gapStr(lead,c);
    const idx=RS.cars.indexOf(c);
    return `<button class="srow ${c.mine?'me':''} ${idx===UI.sel?'sel':''} ${c.dnf?'out':''}" data-act="selcar" data-v="${idx}"><span class="mono">${i+1}</span><span class="c" style="background:${c.team.color}"></span><span>${esc(c.d.name.split(' ')[1])}</span>${ar}${tring(c)}<span class="mono muted" style="text-align:center">${c.stops}</span><span class="g">${gap}</span></button>`}).join('');
  // label for selected car
  const t=RS.cars[UI.sel]||lead,tp=o.indexOf(t);
  $('#lbl').style.setProperty('--tc',t.team.color);$('#lp').textContent=ord(tp+1);$('#ln').textContent=t.d.name.split(' ')[1];
  $('#ls').innerHTML=`PACE <span class="${(o[tp-1]&&t.lt<o[tp-1].lt)?'good':'bad'}">${tp>0?sgn(t.lt-o[tp-1].lt):'leader'}</span> · LAP ${Math.min(t.lapsDone+1,RS.laps)}`;
  $('#lt').innerHTML=`${tring(t)} ${Math.round(100-t.tyre.wear)}%`;
  // driver panels
  RS.mineCars.forEach((c,i)=>{
    const pos=o.indexOf(c),a=o[pos-1],b=o[pos+1],lapsLeft=RS.laps-c.lapsDone;
    $(`#p${i}-pos`).textContent=c.dnf?'OUT':ord(pos+1);
    const ap=$(`#p${i}-ap`),bp=$(`#p${i}-bp`);ap.textContent=a?pos:'–';ap.style.setProperty('--tc',a?a.team.color:'#888');bp.textContent=b?pos+2:'–';bp.style.setProperty('--tc',b?b.team.color:'#888');
    $(`#p${i}-ag`).textContent=a&&!c.dnf?gapStr(a,c):'—';$(`#p${i}-bg`).textContent=b&&!b.dnf&&!c.dnf?gapStr(c,b):'—';
    $(`#p${i}-last`).textContent=c.fin?'Finished':c.pitT>0?'In pits':fmtT(c.last);
    const pc=$(`#p${i}-pace`);if(a&&!c.dnf){const d=c.lt-a.lt;pc.textContent=sgn(d);pc.className=d<0?'good':'bad'}else{pc.textContent='—';pc.className=''}
    $(`#p${i}-mode`).textContent=['Conserve','Standard','Attack'][c.mode]+(c.focus?' · '+FOCUS[c.focus]:'');
    const ty=TYRES[c.tyre.c],gg=$(`#p${i}-g`);gg.style.setProperty('--c',ty.col);gg.style.setProperty('--w',Math.round(100-c.tyre.wear));$(`#p${i}-gk`).textContent=ty.k;$(`#p${i}-gw`).textContent=Math.round(100-c.tyre.wear)+'%';
    $(`#p${i}-fl`).textContent=c.fuel.toFixed(1)+' laps';const sur=c.fuel-lapsLeft;const fs=$(`#p${i}-fs`);fs.textContent=c.fin?'':(sur>=0?'+':'')+sur.toFixed(1);fs.className=sur>=0?'good':'bad';
    $(`#p${i}-fb`).style.height=(c.fuel/tr.cap*100)+'%';
    const tp=$(`#p${i}-tpit`);tp.classList.toggle('boxing',!!c.box);tp.textContent=c.box?'Boxing':'Pit';
    for(const v of['pit','cond','strat'])$(`#p${i}-t${v}`).classList.toggle('on',UI.pop[i]===v);
    const pop=$(`#pop${i}`);
    if(UI.pop[i]==='pit'){
      for(const k of[...TK,'keep'])$(`#q${i}-t${k}`).classList.toggle('on',c.boxSel===k);
      const fsl=$(`#q${i}-fuel`),fv=c.fuelT??fuelTo(c,tr);if(document.activeElement!==fsl)fsl.value=fv;$(`#q${i}-fv`).textContent=`${(+fv).toFixed(1)} laps (+${Math.max(0,fv-c.fuel).toFixed(1)})`;
      $(`#q${i}-rep`).checked=c.rep;$(`#q${i}-rt`).textContent=`(+${(PARTS.reduce((s,[k])=>s+100-c.pc[k],0)*.02).toFixed(1)}s)`;
      const e=estStop(c);$(`#q${i}-est`).textContent=`Stationary ${e.work.toFixed(1)}s · total ~${e.total.toFixed(0)}s`;
      const bx=$(`#q${i}-box`);bx.classList.toggle('on',!!c.box);bx.textContent=c.box?'Cancel box':'Box this lap';bx.disabled=!!(c.dnf||c.fin);
      const call=!c.dnf&&!c.fin?engineerCall(c,tr):null;
      $(`#q${i}-eng`).textContent=c.dnf?`Retired: ${c.dnf}.`:c.fin?'Car is home.':call?`Engineer: ${call.why}. Suggest ${call.c==='keep'?'keeping these tyres':TYRES[call.c].n}${call.rep?' with repairs':''}, fuel to ${call.fuel} laps.`:`Engineer: stay out. ${lapsLeft} laps to go.`;
    }else if(UI.pop[i]==='cond'){
      for(const[k]of PARTS){const v=Math.max(0,c.pc[k]),el=$(`#q${i}-c${k}`);el.style.width=v+'%';el.style.background=v<38?'var(--bad)':v<60?'var(--warn)':'var(--good)';$(`#q${i}-cv${k}`).textContent=Math.round(v)+'%'}
    }else if(UI.pop[i]==='strat'){
      for(let k=0;k<3;k++){$(`#q${i}-m${k}`).classList.toggle('on',c.mode===k);$(`#q${i}-e${k}`).classList.toggle('on',c.eng===k)}for(let f=0;f<4;f++)$(`#q${i}-f${f}`).classList.toggle('on',(c.focus||0)===f);
    }
  });
  $('#feed').innerHTML=RS.feed.slice(0,40).map(f=>`<div class="${f.cls}">L${f.lap} · ${esc(f.text)}</div>`).join('');
}
function openPop(i,kind){
  UI.pop[i]=UI.pop[i]===kind?null:kind;const pop=$(`#pop${i}`);
  if(UI.pop[i]&&matchMedia('(max-width:1200px)').matches){const j=1-i;if(UI.pop[j]){UI.pop[j]=null;const o=$(`#pop${j}`);if(o){o.hidden=true;o.innerHTML=''}}}
  if(UI.pop[i]){pop.innerHTML=`<button class="popx" data-act="pop" data-c="${i}" data-v="${kind}" aria-label="Close">✕</button>`+popHTML(i,kind);pop.hidden=false}else{pop.hidden=true;pop.innerHTML=''}
  updRaceUI();
}
function renderResults(){
  const L=G.last,f=L.fin;
  const rows=[['Sponsorship',f.sponsor],[`Sponsor bonus (${ord(L.target)} target)`,f.bonus],['Prize money',f.prize],['Driver salaries',f.salaries],['Running costs',f.running]];if(f.staff)rows.push(['Engineer salaries',f.staff]);if(f.fine)rows.push(['Scrutineering fine',f.fine]);
  app.innerHTML=topBar('Race result',`Round ${L.round+1}: ${L.track}`)+`<h2 style="margin-bottom:16px">${L.track} Grand Prix</h2>
  <div class="grid2"><div class="panel"><div class="scroll"><table><tr><th>Pos</th><th>Driver</th><th>Team</th><th>Grid</th><th>Stops</th><th>Best lap</th><th>Pts</th></tr>
   ${L.res.map(r=>{const d=drv(r.id),t=team(d.teamId)||{color:'#888',short:'—'};return `<tr class="${d.teamId==='P'?'me':''}"><td class="mono">${r.dnf?'DNF':r.pos}</td><td>${esc(d.name)}${r.dnf?` <span class="muted" style="font-size:11px">${esc(r.dnf)}</span>`:''}</td><td><span class="chip" style="background:${t.color}"></span>${t.short}</td><td class="mono">${r.grid}</td><td class="mono">${r.stops}</td><td class="mono ${r.fl?'purple':''}">${fmtT(r.best)}</td><td class="mono"><b>${r.pts||''}</b></td></tr>`}).join('')}</table></div></div>
  <div class="stack"><div class="panel"><h3>Team finances</h3><table>${rows.map(([n,v])=>`<tr><td>${n}</td><td class="mono ${v<0?'bad':'good'}" style="text-align:right">${money(v)}</td></tr>`).join('')}<tr><td><b>Net</b></td><td class="mono" style="text-align:right"><b>${money(L.net)}</b></td></tr></table>
   ${f.project?`<p class="warn" style="margin-bottom:0">${esc(f.project)}</p>`:''}</div>
   <div class="panel stack"><div><div class="eyebrow">Press pen</div><h3 style="margin-top:4px">“${esc(L.q.q.replace('{best}',drv(L.bestId).name))}”</h3></div>
    ${L.answered==null?`<div class="qa">${L.q.a.map((a,i)=>`<button data-act="answer" data-v="${i}">${esc(a[0].replace('{best}',drv(L.bestId).name))}</button>`).join('')}</div>`:`<p class="muted" style="margin:0">You said: “${esc(L.q.a[L.answered][0].replace('{best}',drv(L.bestId).name))}”</p>`}
    <div class="muted" style="font-size:12px">${PT().drivers.map(id=>`${drv(id).name}: morale ${drv(id).morale}`).join(' · ')}</div>
    <button class="btn" data-act="next" ${L.answered==null?'disabled':''}>${G.round>=TRACKS.length?'Season review ›':'Continue ›'}</button></div></div></div>`;
}
// teams table with promotion (green) and relegation (red) zones marked
function teamTable(l){
  const st=standingsT(l),n=st.length;
  return `<table><tr><th>Pos</th><th>Team</th><th>Car</th><th>Pts</th><th></th></tr>${st.map((x,i)=>{const up=l>0&&i<2,dn=l<2&&i>=n-2;
    return `<tr class="${x.id==='P'?'me':''}"><td class="mono" style="border-left:3px solid ${up?'var(--good)':dn?'var(--bad)':'transparent'}">${i+1}</td><td><span class="chip" style="background:${x.color}"></span>${esc(x.name)}</td><td class="mono">${carAvg(x).toFixed(1)}</td><td class="mono"><b>${x.points}</b></td><td class="mono" style="font-size:11px">${up?'<span class="good">▲ up</span>':dn?'<span class="bad">▼ down</span>':''}</td></tr>`}).join('')}</table>`;
}
/* ---------- demo, tutorial, settings, save transfer ---------- */
function buyLink(label){return BUY_URL?`<a class="btn" href="${BUY_URL}" target="_blank" rel="noopener" style="text-decoration:none;display:inline-block">${label}</a>`:`<p style="margin:0">Search for <b>${GAME_NAME}</b> on itch.io.</p>`}
function demoEnd(){return `<div class="stack" style="gap:10px;border:1px solid var(--go);border-radius:4px;padding:14px"><h3>That's the end of the demo</h3>
  <p style="margin:0">Thanks for playing. The full game has all three championships with promotion and relegation, unlimited seasons, and every team to manage.</p>${buyLink('Get the full game ›')}</div>`}
const TUT={
 hub:[['Welcome to '+GAME_NAME,'You run a racing team. Win races, earn money, and climb from the Challenger Series to the Apex World Championship. The top two teams each season are promoted.'],
  ['Home','Your goals, sponsor target, factory and calendar. Press Continue (bottom right) to start the next race weekend.'],
  ['Car','Design new parts to make the car faster. Each part feeds top speed, acceleration or cornering. Hire staff engineers to build several parts at once.'],
  ['Drivers','Check your drivers\' skills and morale, and sign better ones from the market.'],
  ['Race weekend','Practice: tune the setup from driver feedback. Qualifying sets the grid. Then pick tyres, fuel and race focus for each driver.']],
 race:[['The race','The camera follows your car. Tap a car or a name in the standings to follow it, or switch to Track view.'],
  ['Your drivers','Each driver has a panel: position, tyre wear (the ring) and fuel. Pit sets up a stop, Condition shows part wear, Strategy sets focus, driving style and engine mode.'],
  ['Pit stops','The fuel tank never lasts the whole race, so plan at least one stop. Choose tyres and fuel, then press Box this lap. Your engineer suggests when to stop.'],
  ['Speed','Use ×1 to ×30 to speed up, pause any time, or End to simulate to the finish.']]};
function showTut(kind,i=0){
  document.querySelector('.tut')?.remove();const steps=TUT[kind];
  if(kind==='race'&&RS&&i===0){UI.tutSpeed=RS.speed;RS.speed=0}
  const el=document.createElement('div');el.className='tut';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');
  el.innerHTML=`<div class="card"><div class="eyebrow">How to play · ${i+1} of ${steps.length}</div><h3>${steps[i][0]}</h3><p style="margin:0">${steps[i][1]}</p>
   <div class="row" style="justify-content:space-between"><button class="ghost" data-tut="skip">Skip</button><div class="row" style="gap:8px">${i?'<button class="ghost" data-tut="back">Back</button>':''}<button class="btn" data-tut="next">${i===steps.length-1?'Start':'Next'}</button></div></div></div>`;
  el.addEventListener('click',e=>{const b=e.target.closest('[data-tut]');if(!b)return;e.stopPropagation();const a=b.dataset.tut;
    if(a==='back')return showTut(kind,i-1);
    if(a==='next'&&i<steps.length-1)return showTut(kind,i+1);
    el.remove();if(G&&G.tut){G.tut[kind]=true;save()}if(kind==='race'&&RS)RS.speed=UI.tutSpeed??10});
  document.body.appendChild(el);el.querySelector('[data-tut=next]').focus();
}
function exportCode(){try{return btoa(unescape(encodeURIComponent(JSON.stringify({G:{...G,teams:undefined},W}))))}catch(e){return ''}}
function importCode(code){try{const s=JSON.parse(decodeURIComponent(escape(atob(code.trim()))));if(!s||!s.G||!s.G.series)throw 0;
  localStorage.setItem(SAVE,JSON.stringify(s));loadSave();RS=null;if(G.screen==='weekend'&&W&&W.phase==='race')W.phase='quali';UI.tab='overview';render();toast('Career loaded.')}catch(e){toast('That code is not a valid save. Check you copied all of it.')}}
function settingsHTML(){
  return `<div class="grid2">
   <div class="panel stack"><h3>How to play</h3><p class="muted" style="margin:0">Replay the quick guide to the team screens and the race controls.</p>
    <div class="row"><button class="ghost" data-act="tutagain" data-v="hub">Team screens guide</button><button class="ghost" data-act="tutagain" data-v="race">Race guide (next race)</button></div></div>
   <div class="panel stack"><h3>Move your career</h3><p class="muted" style="margin:0">Saves stay in this browser. To continue on another device or in another version of the game, copy this code there and paste it below.</p>
    <textarea id="excode" readonly rows="3" style="width:100%;background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:3px;padding:8px;font:11px var(--f-mono)">${exportCode()}</textarea>
    <div class="row"><button class="ghost" data-act="copycode">Copy code</button></div>
    <label class="eyebrow" for="imcode">Load a career from a code</label>
    <textarea id="imcode" rows="3" placeholder="Paste a save code here" style="width:100%;background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:3px;padding:8px;font:11px var(--f-mono)"></textarea>
    <div class="row"><button class="ghost" data-act="importcode">Load career</button><span class="muted" style="font-size:12px">This replaces the career on this device.</span></div></div>
   <div class="panel stack"><h3>Reset career</h3><p class="muted" style="margin:0">Deletes this career from this device. It cannot be undone.</p>
    ${UI.confirmReset?`<div class="row"><button class="btn" style="background:var(--bad);color:#fff" data-act="resetyes">Yes, delete my career</button><button class="ghost" data-act="resetno">Cancel</button></div>`:'<div class="row"><button class="ghost" data-act="reset">Reset career…</button></div>'}</div>
   <div class="panel stack"><h3>About</h3><p style="margin:0"><b>${GAME_NAME}</b> · version ${VERSION}${DEMO?' · free demo':''}</p>
    <p class="muted" style="margin:0">All teams, drivers and circuits are fictional. Fonts: Barlow Condensed, Inter and JetBrains Mono, used under the SIL Open Font License.</p>
    ${DEMO?buyLink('Get the full game ›'):''}</div></div>`;
}
function renderSeason(){
  const sd=standingsD(),st=standingsT(),pos=st.findIndex(t=>t.id==='P');
  const me=seasonMoves().find(m=>m.id==='P'),up=me&&me.to<me.from;
  const headline=me?(up?`Promoted to the ${SERIES[me.to].name}!`:`Relegated to the ${SERIES[me.to].name}`):`${esc(sd[0].name)} is ${SER().short} champion`;
  app.innerHTML=topBar('Season review',`Season ${G.season} complete`)+`<h1 style="font-size:clamp(36px,6vw,64px);margin:8px 0 16px" class="${me?(up?'good':'bad'):''}">${headline}</h1>
   <div class="grid2"><div class="panel stack"><h3>Your season</h3><p style="margin:0">You finished <b>${ord(pos+1)}</b> in the ${SER().name}, earning ${money(PRIZE[pos]*SER().prize*1e6)} in end-of-season prize money.</p>
    ${me?`<p style="margin:0">${up?`Next season you race in tier ${me.to+1}. Expect to be near the back at first: the cars there are much faster, but the budgets and sponsors are bigger. You get a promotion bonus of ${money(SERIES[me.to].budget[0]*.4e6)}.`:`Next season you race in tier ${me.to+1}, with smaller budgets and slower rivals. You get a parachute payment of ${money(SERIES[me.to].budget[0]*.3e6)}.`}</p>`:''}
    <p class="muted" style="margin:0">New regulations next season reduce every team's part performance by 7%. Drivers age: young ones improve, veterans fade. Grey-area parts become legal. A driver with morale under 20 will quit.</p>
    ${DEMO?demoEnd():`<button class="btn" data-act="season">Start season ${G.season+1} ›</button>`}</div>
   ${SERIES.map((s,l)=>`<div class="panel"><h3>Tier ${l+1} · ${s.name}</h3><p class="muted" style="margin:2px 0 8px">Champion: ${esc(standingsD(l)[0].name)}</p><div class="scroll">${teamTable(l)}</div></div>`).join('')}</div>`;
}

/* ---------- input ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el){if(e.target.id==='cv'&&RS)pickCar(e);return}
  const a=el.dataset.act,v=el.dataset.v;
  const pc=()=>RS.mineCars[+el.dataset.c];
  switch(a){
    case 'pickteam':UI.picking=true;UI.pick=[2,7];UI.preview=null;render();break;
    case 'back':UI.picking=false;render();break;
    case 'pickser':{if(DEMO&&+v!==2)break;const n=$('#tname');if(n)UI.newName=n.value.trim();UI.pick=[+v,+v===2?7:0];render();break}
    case 'pickidx':{const n=$('#tname');if(n)UI.newName=n.value.trim();UI.pick=[UI.pick[0],+v];render();break}
    case 'color':{const n=$('#tname');if(n)UI.newName=n.value.trim();UI.newColor=v;render();break}
    case 'new':{const n=$('#tname');if(n)UI.newName=n.value.trim();newGame(UI.pick,UI.newName,UI.newColor);UI.picking=false;UI.tab='overview';UI.stSer=null;render();break}
    case 'stser':UI.stSer=+v;render();break;
    case 'continue':loadSave();if(G.screen==='weekend'&&W&&W.phase==='race'){RS=null;W.phase='quali'}render();break;
    case 'quit':G=null;W=null;RS=null;render();break;
    case 'tutagain':G.tut[v]=false;save();if(v==='hub'){UI.tab='overview';render()}else toast('The race guide will show at the start of your next race.');break;
    case 'copycode':{const t=$('#excode');const done=()=>toast('Save code copied.');try{navigator.clipboard.writeText(t.value).then(done,()=>{t.select();toast('Select all and copy the code.')})}catch(e){t.select();toast('Select all and copy the code.')}break}
    case 'importcode':importCode($('#imcode').value);break;
    case 'reset':UI.confirmReset=true;render();break;
    case 'resetno':UI.confirmReset=false;render();break;
    case 'resetyes':UI.confirmReset=false;try{localStorage.removeItem(SAVE)}catch(e){}G=null;W=null;RS=null;render();toast('Career deleted.');break;
    case 'tab':UI.tab=v;render();break;
    case 'weekend':startWeekend();break;
    case 'design':startDesign(v);break;
    case 'hireeng':hireEng(v);break;
    case 'fireeng':fireEng(v);break;
    case 'sign':sign(v,+el.dataset.s);break;
    case 'run':practiceRun(el.dataset.id);break;
    case 'quali':runQuali();break;
    case 'stTyre':W.startTyre[el.dataset.id]=v;save();render();break;
    case 'race':startRace();break;
    case 'speed':RS.speed=+v;document.querySelectorAll('[data-act=speed]').forEach(b=>b.classList.toggle('on',b===el));break;
    case 'simend':{let n=0;while(!RS.over&&n<400000){step(.5);n++}updRaceUI();break}
    case 'results':finishRace();break;
    case 'cam':UI.cam.mode=v;updRaceUI();break;
    case 'selcar':UI.sel=+v;UI.cam.mode='follow';updRaceUI();break;
    case 'pop':openPop(+el.dataset.c,v);break;
    case 'mode':pc().mode=+v;updRaceUI();break;
    case 'eng':pc().eng=+v;updRaceUI();break;
    case 'focus':pc().focus=+v;updRaceUI();break;
    case 'stFocus':W.startFocus[el.dataset.id]=+v;save();render();break;
    case 'boxtyre':{const c=pc();c.boxSel=v;if(c.box)c.box.c=v;updRaceUI();break}
    case 'rep':{const c=pc();c.rep=el.checked;if(c.box)c.box.rep=c.rep;updRaceUI();break}
    case 'box':{const c=pc();c.box=c.box?null:{c:c.boxSel,rep:c.rep,fuel:c.fuelT??null};updRaceUI();break}
    case 'answer':answer(+v);break;
    case 'next':afterResults();break;
    case 'season':newSeason();break;
  }
});
function pickCar(e){
  const r=e.target.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;let best=-1,bd=40;
  RS.cars.forEach((c,i)=>{const s=UI.sp[c.id];if(!s||c.dnf)return;const d=Math.hypot(s[0]-x,s[1]-y);if(d<bd){bd=d;best=i}});
  if(best>=0){UI.sel=best;updRaceUI()}
}
document.addEventListener('input',e=>{
  const el=e.target,a=el.dataset.act;
  if(a==='slide'){const s=W.setup[el.dataset.id];s.v[+el.dataset.i]=+el.value;$(`#sv-${el.dataset.id}-${el.dataset.i}`).textContent=el.value;save()}
  if(a==='sfuel'){W.startFuel[el.dataset.id]=+el.value;$(`#sfv-${el.dataset.id}`).textContent=el.value+' laps';save()}
  if(a==='pfuel'){const c=RS.mineCars[+el.dataset.c];c.fuelT=+el.value;if(c.box)c.box.fuel=c.fuelT;updRaceUI()}
  if(el.id==='tname')UI.newName=el.value.trim();
});
document.addEventListener('change',e=>{if(e.target.dataset.act==='dpart'){UI.dpart=e.target.value}});
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(RS&&G&&G.screen==='weekend')sizeCanvas();else if(G&&G.screen==='hub'&&UI.tab==='overview')render()},150)});
render();
</script>
